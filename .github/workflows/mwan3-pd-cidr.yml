name: Verify complete mwan3 delegated-prefix matching
on:
  push:
    branches: [bootstrap/mwan3-pd-cidr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import exact signed-off candidate
        run: |
          git fetch origin 468595cd094d718323fa2f2bb050c80ab940239e
          base64 -d ci/mwan3-pd/source.bundle.b64 > "$RUNNER_TEMP/source.bundle"
          echo 'a10ea3f28a32484cc3500864d7987506d79819dbc8e2bba4fe4a7ee26cadde8f  '"$RUNNER_TEMP/source.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/source.bundle"
          git fetch "$RUNNER_TEMP/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = 34ed53288030ffab912caf17071586f9648dd314
          git push origin FETCH_HEAD:refs/heads/fix/mwan3-ipv6-pd-prefix-filter
  native:
    needs: import
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          sparse-checkout: ci/mwan3-pd
      - uses: actions/checkout@v4
        with:
          ref: fix/mwan3-ipv6-pd-prefix-filter
          path: packages
          sparse-checkout: net/mwan3
      - run: sudo apt-get update -qq && sudo apt-get install -y iproute2 busybox
      - run: bash control/ci/mwan3-pd/native.sh "$PWD/packages" "$RUNNER_TEMP/mwan3-pd-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mwan3-pd-native-evidence
          path: ${{ runner.temp }}/mwan3-pd-native
  sdk:
    needs: import
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          sparse-checkout: ci/mwan3-pd
      - uses: actions/checkout@v4
        with:
          ref: fix/mwan3-ipv6-pd-prefix-filter
          path: packages
          sparse-checkout: net/mwan3
      - run: sudo apt-get update -qq && sudo apt-get install -y build-essential gawk libncurses-dev zlib1g-dev file unzip zstd python3 curl busybox iproute2 qemu-user strace
      - run: bash control/ci/mwan3-pd/sdk.sh "$PWD/packages" "$RUNNER_TEMP/mwan3-pd-sdk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mwan3-pd-sdk-apk-evidence
          path: ${{ runner.temp }}/mwan3-pd-sdk
